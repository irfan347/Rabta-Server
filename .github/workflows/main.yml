name: Build Rabta APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Locate or extract Android project
        id: project
        shell: bash
        run: |
          python3 - <<'PYTHON'
          #!/usr/bin/env python3
          """Find an Android Gradle root in a checkout, or safely unpack one source ZIP."""
          from pathlib import Path, PurePosixPath
          import os
          import stat
          import sys
          import zipfile
          
          SETTINGS = ("settings.gradle.kts", "settings.gradle")
          BUILDS = ("build.gradle.kts", "build.gradle")
          IGNORED = {".git", ".gradle", "build", "node_modules", ".android-source", "__MACOSX"}
          
          
          def is_project(path):
              return any((path / s).is_file() for s in SETTINGS) and any(
                  (path / "app" / b).is_file() for b in BUILDS
              )
          
          
          def projects_in(root):
              candidates = []
              for current, dirs, _ in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in IGNORED and not (Path(current)/d).is_symlink()]
                  path = Path(current)
                  if is_project(path):
                      candidates.append(path)
                      dirs.clear()
              return candidates
          
          
          def zip_has_project(path):
              try:
                  with zipfile.ZipFile(path) as archive:
                      names = set(archive.namelist())
                      for name in names:
                          if PurePosixPath(name).name in SETTINGS:
                              prefix = str(PurePosixPath(name).parent)
                              prefix = "" if prefix == "." else prefix + "/"
                              if any(prefix + "app/" + b in names for b in BUILDS):
                                  return True
              except zipfile.BadZipFile:
                  pass
              return False
          
          
          def safe_extract(path, target):
              with zipfile.ZipFile(path) as archive:
                  total = sum(i.file_size for i in archive.infolist())
                  if total > 256 * 1024 * 1024:
                      raise ValueError("Source ZIP exceeds 256 MiB expanded limit")
                  for info in archive.infolist():
                      relative = PurePosixPath(info.filename)
                      if relative.is_absolute() or ".." in relative.parts or "\\" in info.filename:
                          raise ValueError("Unsafe path in source ZIP")
                      if stat.S_ISLNK(info.external_attr >> 16):
                          raise ValueError("Symlinks are not accepted in source ZIP")
                  archive.extractall(target)
          
          
          def locate(root):
              root = Path(root).resolve()
              if is_project(root):
                  return root
              candidates = projects_in(root)
              if not candidates:
                  archives = []
                  for current, dirs, files in os.walk(root):
                      dirs[:] = [d for d in dirs if d not in IGNORED and not (Path(current)/d).is_symlink()]
                      archives.extend(Path(current)/f for f in files if f.lower().endswith(".zip") and zip_has_project(Path(current)/f))
                  if len(archives) != 1:
                      raise ValueError(f"Expected one Android source ZIP; found {len(archives)}. Keep one ZIP or extract the project at the repository root.")
                  target = root / ".android-source"
                  if target.exists():
                      raise ValueError(".android-source already exists; use a clean checkout")
                  safe_extract(archives[0], target)
                  candidates = projects_in(target)
              if len(candidates) != 1:
                  raise ValueError(f"Expected one Android Gradle project; found {len(candidates)}. Remove duplicate source copies.")
              return candidates[0]
          
          
          if __name__ == "__main__":
              try:
                  project = locate(sys.argv[1] if len(sys.argv) > 1 else ".")
                  relative = project.relative_to(Path.cwd().resolve())
                  value = str(relative)
                  if any(c in value for c in "\r\n"):
                      raise ValueError("Project path contains a newline")
                  print(f"Android Gradle project: {value}")
                  if os.environ.get("GITHUB_OUTPUT"):
                      with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                          output.write(f"directory={value}\n")
              except ValueError as error:
                  sys.exit(str(error))
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Check project detection and database queries
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: |
          if [ -d "$ANDROID_PROJECT_DIR/tests" ]; then
            python3 -m unittest discover -s "$ANDROID_PROJECT_DIR/tests" -v
          fi
      - name: Test server attachment storage and signaling
        run: |
          if [ -f tests/server.test.js ]; then node --test tests/*.test.js; fi
      - name: Read-only live connection diagnosis
        timeout-minutes: 3
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: python3 "$ANDROID_PROJECT_DIR/scripts/check_live_server.py"
      - name: Inspect existing QR dependency
        run: gradle --project-dir android :app:dependencyInsight --dependency com.google.zxing:core --configuration debugRuntimeClasspath --no-daemon
      - name: Build and test APK
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: gradle --project-dir "$ANDROID_PROJECT_DIR" :app:testDebugUnitTest :app:assembleDebug :app:assembleDevice --no-daemon --stacktrace
      - name: Record QR regression failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path("android/app/build/test-results").rglob("TEST-*InstantQrTest*.xml"):
              root=ET.parse(report).getroot()
              for failure in root.iter("failure"):
                  print((failure.text or "")[:10000])
          PY
      - name: Verify integration ancestry and installable Debug APK
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=100 origin integration/rabta-device-test-20261017
          for commit in d7c480a8e169013935435995141de5ba36277aa6 ff9092a5d52cf13a9bbee0bc41627258dff5d63c 378266076b850471731c73614ad9dfa5fd16b71c a1bfd2fa439428f9b4d9335321c3eb20a657812e; do
            git merge-base --is-ancestor "$commit" FETCH_HEAD
          done
          node --check index.js
          node --check features.js
          apk="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
          "$tools/aapt" dump badging "$apk" > "$apk.badging.txt"
          grep -q "package: name='com.irfan.rabta'" "$apk.badging.txt"
          grep -q "application-debuggable" "$apk.badging.txt"
          {
            echo "Source commit: ${{ github.sha }}"
            sha256sum "$apk"
            stat --format='APK bytes: %s' "$apk"
            cat "$apk.signature.txt"
            cat "$apk.badging.txt"
          } > "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/APK-VERIFICATION.txt"
          cat "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/APK-VERIFICATION.txt"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-debug-apk
          path: |
            ${{ steps.project.outputs.directory }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.project.outputs.directory }}/app/build/outputs/apk/debug/APK-VERIFICATION.txt
          if-no-files-found: error
      - name: Verify isolated device-test APK
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$ANDROID_PROJECT_DIR/app/build/outputs/apk/device/app-device.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
          "$tools/aapt" dump badging "$apk" > "$apk.badging.txt"
          grep -q "package: name='com.irfan.rabta.testing'" "$apk.badging.txt"
          grep -q "application-label:'Rabta Test'" "$apk.badging.txt"
          grep -q "application-debuggable" "$apk.badging.txt"
          {
            echo "Source commit: ${{ github.sha }}"
            sha256sum "$apk"
            stat --format='APK bytes: %s' "$apk"
            cat "$apk.signature.txt"
            cat "$apk.badging.txt"
          } > "$ANDROID_PROJECT_DIR/app/build/outputs/apk/device/APK-VERIFICATION.txt"
          cat "$ANDROID_PROJECT_DIR/app/build/outputs/apk/device/APK-VERIFICATION.txt"
      - name: Upload isolated device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-device-test-apk
          path: |
            ${{ steps.project.outputs.directory }}/app/build/outputs/apk/device/*.apk
            ${{ steps.project.outputs.directory }}/app/build/outputs/apk/device/APK-VERIFICATION.txt
          if-no-files-found: error
      - name: Android lint
        id: lint
        run: gradle --project-dir android :app:lintDebug --no-daemon --stacktrace
      - name: Summarize Android validation reports
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import collections
          import xml.etree.ElementTree as ET
          reports=Path('android/app/build/test-results/testDebugUnitTest')
          suites=[ET.parse(p).getroot() for p in reports.glob('TEST-*.xml')]
          print('JVM test totals:',{key:sum(int(s.get(key,0)) for s in suites) for key in ('tests','failures','errors','skipped')})
          report=Path('android/app/build/reports/lint-results-debug.xml')
          if report.exists():
              issues=ET.parse(report).getroot().findall('issue')
              print('Lint totals:',dict(collections.Counter(i.get('severity') for i in issues)))
              for issue in issues:
                  if issue.get('severity') in ('Error','Fatal'):
                      print(issue.get('id'),issue.get('message'))
                      for location in issue.findall('location'):
                          print(location.attrib)
          PYTHON
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-lint-reports
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-test-reports
          path: ${{ steps.project.outputs.directory }}/app/build/reports/tests/
          if-no-files-found: ignore

  interface:
    if: github.event_name == 'pull_request'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise interface and capture real Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --project-dir android :app:assembleDebug :app:assembleDevice --no-daemon
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as com.irfan.rabta mkdir -p files
            adb shell run-as com.irfan.rabta touch files/rabta-ci-preservation-check
            adb install -r android/app/build/outputs/apk/device/app-device.apk
            adb shell pm path com.irfan.rabta
            adb shell pm path com.irfan.rabta.testing
            adb shell am start -W -n com.irfan.rabta.testing/com.irfan.rabta.AuthActivity
            adb shell pidof com.irfan.rabta.testing
            adb shell am force-stop com.irfan.rabta.testing
            adb shell run-as com.irfan.rabta ls files/rabta-ci-preservation-check
            bash -c 'if adb shell run-as com.irfan.rabta.testing ls files/rabta-ci-preservation-check >/dev/null 2>&1; then echo "Test package unexpectedly sees original private fixture"; exit 1; fi'
            adb shell run-as com.irfan.rabta rm files/rabta-ci-preservation-check
            bash -c 'result=0; gradle --project-dir android :app:connectedDebugAndroidTest --no-daemon || result=$?; adb pull /sdcard/Download/rabta-interface interface-screenshots || true; exit "$result"'
      - name: Summarize instrumented test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases=[]
          for path in Path('android/app/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              cases.extend(ET.parse(path).getroot().iter('testcase'))
          print('Device test totals:',{'tests':len(cases),'failed':sum(c.find('failure') is not None or c.find('error') is not None for c in cases),'skipped':sum(c.find('skipped') is not None for c in cases)})
          for case in cases:
              for tag in ('failure','error'):
                  failure=case.find(tag)
                  if failure is not None:
                      print(case.get('classname'),case.get('name'),(failure.text or '')[:6000])
          PYTHON
      - name: Review rendered premium screens
        if: always() && matrix.api == 34
        shell: bash
        run: |
          if [ -f interface-screenshots/premium-review.b64 ]; then
            echo 'RABTA_PREVIEW_BEGIN'
            cat interface-screenshots/premium-review.b64
            echo
            echo 'RABTA_PREVIEW_END'
          fi
      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-interface-screenshots-api-${{ matrix.api }}
          path: interface-screenshots/
          if-no-files-found: ignore
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-device-tests-api-${{ matrix.api }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
