name: Build Rabta APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Public home of the APK and rabta-update.json only, so this source repository can be private.
  RELEASES_REPO: irfan347/rabta-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      release: ${{ steps.public.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate or extract Android project
        id: project
        shell: bash
        run: |
          python3 - <<'PYTHON'
          #!/usr/bin/env python3
          """Find an Android Gradle root in a checkout, or safely unpack one source ZIP."""
          from pathlib import Path, PurePosixPath
          import os
          import stat
          import sys
          import zipfile
          
          SETTINGS = ("settings.gradle.kts", "settings.gradle")
          BUILDS = ("build.gradle.kts", "build.gradle")
          IGNORED = {".git", ".gradle", "build", "node_modules", ".android-source", "__MACOSX"}
          
          
          def is_project(path):
              return any((path / s).is_file() for s in SETTINGS) and any(
                  (path / "app" / b).is_file() for b in BUILDS
              )
          
          
          def projects_in(root):
              candidates = []
              for current, dirs, _ in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in IGNORED and not (Path(current)/d).is_symlink()]
                  path = Path(current)
                  if is_project(path):
                      candidates.append(path)
                      dirs.clear()
              return candidates
          
          
          def zip_has_project(path):
              try:
                  with zipfile.ZipFile(path) as archive:
                      names = set(archive.namelist())
                      for name in names:
                          if PurePosixPath(name).name in SETTINGS:
                              prefix = str(PurePosixPath(name).parent)
                              prefix = "" if prefix == "." else prefix + "/"
                              if any(prefix + "app/" + b in names for b in BUILDS):
                                  return True
              except zipfile.BadZipFile:
                  pass
              return False
          
          
          def safe_extract(path, target):
              with zipfile.ZipFile(path) as archive:
                  total = sum(i.file_size for i in archive.infolist())
                  if total > 256 * 1024 * 1024:
                      raise ValueError("Source ZIP exceeds 256 MiB expanded limit")
                  for info in archive.infolist():
                      relative = PurePosixPath(info.filename)
                      if relative.is_absolute() or ".." in relative.parts or "\\" in info.filename:
                          raise ValueError("Unsafe path in source ZIP")
                      if stat.S_ISLNK(info.external_attr >> 16):
                          raise ValueError("Symlinks are not accepted in source ZIP")
                  archive.extractall(target)
          
          
          def locate(root):
              root = Path(root).resolve()
              if is_project(root):
                  return root
              candidates = projects_in(root)
              if not candidates:
                  archives = []
                  for current, dirs, files in os.walk(root):
                      dirs[:] = [d for d in dirs if d not in IGNORED and not (Path(current)/d).is_symlink()]
                      archives.extend(Path(current)/f for f in files if f.lower().endswith(".zip") and zip_has_project(Path(current)/f))
                  if len(archives) != 1:
                      raise ValueError(f"Expected one Android source ZIP; found {len(archives)}. Keep one ZIP or extract the project at the repository root.")
                  target = root / ".android-source"
                  if target.exists():
                      raise ValueError(".android-source already exists; use a clean checkout")
                  safe_extract(archives[0], target)
                  candidates = projects_in(target)
              if len(candidates) != 1:
                  raise ValueError(f"Expected one Android Gradle project; found {len(candidates)}. Remove duplicate source copies.")
              return candidates[0]
          
          
          if __name__ == "__main__":
              try:
                  project = locate(sys.argv[1] if len(sys.argv) > 1 else ".")
                  relative = project.relative_to(Path.cwd().resolve())
                  value = str(relative)
                  if any(c in value for c in "\r\n"):
                      raise ValueError("Project path contains a newline")
                  print(f"Android Gradle project: {value}")
                  if os.environ.get("GITHUB_OUTPUT"):
                      with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                          output.write(f"directory={value}\n")
              except ValueError as error:
                  sys.exit(str(error))
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check project detection and database queries
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: |
          if [ -d "$ANDROID_PROJECT_DIR/tests" ]; then
            python3 -m unittest discover -s "$ANDROID_PROJECT_DIR/tests" -v
          fi
      - name: Install server test dependencies
        run: npm ci --ignore-scripts
      - name: Test server attachment storage and signaling
        run: |
          if [ -f tests/server.test.js ]; then node --test tests/*.test.js; fi
      - name: Read-only live connection diagnosis
        timeout-minutes: 3
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: python3 "$ANDROID_PROJECT_DIR/scripts/check_live_server.py"
      - name: Inspect existing QR dependency
        run: gradle --project-dir android :app:dependencyInsight --dependency com.google.zxing:core --configuration debugRuntimeClasspath --no-daemon
      - name: Restore stable test signing key
        env:
          KEYSTORE_B64: ${{ secrets.RABTA_TEST_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RABTA_TEST_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "No test signing secrets: this runner's temporary debug key is used, so the APK cannot update an earlier install."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rabta-test.jks"
          echo "RABTA_TEST_KEYSTORE=$RUNNER_TEMP/rabta-test.jks" >> "$GITHUB_ENV"
          echo "RABTA_TEST_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "Stable test signing key restored."
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RABTA_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RABTA_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RABTA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RABTA_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "No release signing secrets: the public APK is not built or published."
            exit 0
          fi
          # Pasted Base64 may carry spaces or line breaks.
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/rabta-release.jks"
          echo "RABTA_RELEASE_KEYSTORE=$RUNNER_TEMP/rabta-release.jks" >> "$GITHUB_ENV"
          echo "RABTA_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RABTA_RELEASE_KEY_ALIAS=${KEY_ALIAS:-rabta}" >> "$GITHUB_ENV"
          if [ -n "$KEY_PASSWORD" ]; then echo "RABTA_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"; fi
          echo "Release signing key restored."
      - name: Build and test APK
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: |
          tasks=":app:testDebugUnitTest :app:assembleDebug :app:assembleDevice"
          if [ -n "${RABTA_RELEASE_KEYSTORE:-}" ]; then tasks="$tasks :app:assembleRelease :app:bundlePlay"; fi
          gradle --project-dir "$ANDROID_PROJECT_DIR" $tasks --no-daemon --stacktrace
      - name: Record QR regression failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path("android/app/build/test-results").rglob("TEST-*InstantQrTest*.xml"):
              root=ET.parse(report).getroot()
              for failure in root.iter("failure"):
                  print((failure.text or "")[:10000])
          PY
      - name: Verify integration ancestry and installable Debug APK
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=100 origin integration/rabta-device-test-20261017
          for commit in d7c480a8e169013935435995141de5ba36277aa6 ff9092a5d52cf13a9bbee0bc41627258dff5d63c 378266076b850471731c73614ad9dfa5fd16b71c a1bfd2fa439428f9b4d9335321c3eb20a657812e; do
            git merge-base --is-ancestor "$commit" FETCH_HEAD
          done
          node --check index.js
          node --check features.js
          apk="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
          "$tools/aapt" dump badging "$apk" > "$apk.badging.txt"
          grep -q "package: name='com.irfan.rabta'" "$apk.badging.txt"
          grep -q "application-debuggable" "$apk.badging.txt"
          {
            echo "Source commit: ${{ github.sha }}"
            sha256sum "$apk"
            stat --format='APK bytes: %s' "$apk"
            cat "$apk.signature.txt"
            cat "$apk.badging.txt"
          } > "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/APK-VERIFICATION.txt"
          cat "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/APK-VERIFICATION.txt"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-debug-apk
          path: |
            ${{ steps.project.outputs.directory }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.project.outputs.directory }}/app/build/outputs/apk/debug/APK-VERIFICATION.txt
          if-no-files-found: error
      - name: Verify isolated device-test APK
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$ANDROID_PROJECT_DIR/app/build/outputs/apk/device/app-device.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
          "$tools/aapt" dump badging "$apk" > "$apk.badging.txt"
          grep -q "package: name='com.irfan.rabta.testing'" "$apk.badging.txt"
          grep -q "application-label:'Rabta Test'" "$apk.badging.txt"
          grep -q "application-debuggable" "$apk.badging.txt"
          {
            echo "Source commit: ${{ github.sha }}"
            sha256sum "$apk"
            stat --format='APK bytes: %s' "$apk"
            cat "$apk.signature.txt"
            cat "$apk.badging.txt"
          } > "$ANDROID_PROJECT_DIR/app/build/outputs/apk/device/APK-VERIFICATION.txt"
          cat "$ANDROID_PROJECT_DIR/app/build/outputs/apk/device/APK-VERIFICATION.txt"
      - name: Upload isolated device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-device-test-apk
          path: |
            ${{ steps.project.outputs.directory }}/app/build/outputs/apk/device/*.apk
            ${{ steps.project.outputs.directory }}/app/build/outputs/apk/device/APK-VERIFICATION.txt
          if-no-files-found: error
      - name: Verify and package the public APK
        id: public
        if: env.RABTA_RELEASE_KEYSTORE != ''
        env:
          ANDROID_PROJECT_DIR: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          out="$ANDROID_PROJECT_DIR/app/build/outputs/apk/release"
          apk="$out/app-release.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$out/signature.txt"
          "$tools/aapt" dump badging "$apk" > "$out/badging.txt"
          grep -q "package: name='com.irfan.rabta'" "$out/badging.txt"
          grep -q "application-label:'Rabta'" "$out/badging.txt"
          if grep -q "application-debuggable" "$out/badging.txt"; then echo "The public APK must not be debuggable."; exit 1; fi
          if grep "native-code:" "$out/badging.txt" | grep -q "x86"; then echo "The public APK must not carry emulator (x86) libraries."; exit 1; fi
          grep -q "targetSdkVersion:'36'" "$out/badging.txt"
          python3 android/scripts/page_size.py "$apk"
          # Debuggable test builds must never carry the public app's signature.
          digest() { grep -m1 "certificate SHA-256 digest" "$1" | awk '{print $NF}'; }
          "$tools/apksigner" verify --print-certs "$ANDROID_PROJECT_DIR/app/build/outputs/apk/device/app-device.apk" > "$out/test-signature.txt"
          if [ "$(digest "$out/signature.txt")" = "$(digest "$out/test-signature.txt")" ]; then echo "The public APK must not use the test key."; exit 1; fi
          OUT="$out" python3 - <<'PYTHON'
          import hashlib, json, os, re, shutil
          from pathlib import Path
          out = Path(os.environ["OUT"])
          code, name = re.search(r"versionCode='(\d+)' versionName='([^']+)'", (out / "badging.txt").read_text()).groups()
          dist = Path("rabta-release"); dist.mkdir()
          apk = dist / f"Rabta-{name}.apk"
          shutil.copy(out / "app-release.apk", apk)
          config = json.loads((Path(os.environ["ANDROID_PROJECT_DIR"]) / "release.json").read_text())
          base = {
              "versionCode": int(code), "versionName": name,
              "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(), "size": apk.stat().st_size,
              "minVersionCode": int(config.get("minVersionCode", 0)), "notes": config.get("notes", ""),
          }
          # An app downloads the APK from wherever it found this file: the public releases repository,
          # or (legacy) this repository for apps installed before the move.
          for file, repo in (("rabta-update.json", os.environ["RELEASES_REPO"]), ("rabta-update-legacy.json", os.environ["GITHUB_REPOSITORY"])):
              info = {**base, "apk": f"https://github.com/{repo}/releases/download/v{name}/{apk.name}"}
              (dist / file).write_text(json.dumps(info, indent=2, ensure_ascii=False))
              print(file, json.dumps(info, indent=2, ensure_ascii=False))
          (dist / "notes.txt").write_text(base["notes"] or f"Rabta {name}")
          PYTHON
          cat "$out/signature.txt"
          # Google Play's copy: an app bundle signed with the public app's own key (Play then signs installs with
          # that same key, so phones that installed Rabta from GitHub update from Play), without the self-updater.
          aab="$ANDROID_PROJECT_DIR/app/build/outputs/bundle/play/app-play.aab"
          test -s "$aab"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$aab" > "$out/play-manifest.xml"
          grep -q 'package="com.irfan.rabta"' "$out/play-manifest.xml"
          grep -q 'android:targetSdkVersion="36"' "$out/play-manifest.xml"
          if grep -q "REQUEST_INSTALL_PACKAGES" "$out/play-manifest.xml"; then echo "The Play bundle must not be able to install updates itself."; exit 1; fi
          # Play keeps these for other kinds of apps; the Play build uses Android's photo picker and battery settings.
          for p in READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_VISUAL_USER_SELECTED REQUEST_IGNORE_BATTERY_OPTIMIZATIONS; do
            if grep -q "android.permission.$p\"" "$out/play-manifest.xml"; then echo "The Play bundle must not ask for $p."; exit 1; fi
          done
          echo "Play bundle permissions:"; grep -o '<uses-permission[^>]*' "$out/play-manifest.xml" | grep -o 'android:name="[^"]*"' | cut -d'"' -f2 | sed 's/^/  /'
          if grep -q 'android:debuggable="true"' "$out/play-manifest.xml"; then echo "The Play bundle must not be debuggable."; exit 1; fi
          python3 android/scripts/page_size.py "$aab"
          keytool -printcert -jarfile "$aab" > "$out/play-signature.txt"
          bundle=$(grep -m1 "SHA256:" "$out/play-signature.txt" | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$bundle" != "$(digest "$out/signature.txt")" ]; then echo "The Play bundle must be signed with the public app's key."; exit 1; fi
          name=$(python3 -c 'import json; print(json.load(open("rabta-release/rabta-update.json"))["versionName"])')
          cp "$aab" "rabta-release/Rabta-$name.aab"
          echo "Play bundle: Rabta-$name.aab, signed with the public app's key"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Upload the public APK
        if: steps.public.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-release-apk
          path: rabta-release/
          if-no-files-found: error
      - name: Android lint
        id: lint
        run: gradle --project-dir android :app:lintDebug --no-daemon --stacktrace
      - name: Summarize Android validation reports
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import collections
          import xml.etree.ElementTree as ET
          reports=Path('android/app/build/test-results/testDebugUnitTest')
          suites=[ET.parse(p).getroot() for p in reports.glob('TEST-*.xml')]
          print('JVM test totals:',{key:sum(int(s.get(key,0)) for s in suites) for key in ('tests','failures','errors','skipped')})
          report=Path('android/app/build/reports/lint-results-debug.xml')
          if report.exists():
              issues=ET.parse(report).getroot().findall('issue')
              print('Lint totals:',dict(collections.Counter(i.get('severity') for i in issues)))
              for issue in issues:
                  if issue.get('severity') in ('Error','Fatal'):
                      print(issue.get('id'),issue.get('message'))
                      for location in issue.findall('location'):
                          print(location.attrib)
          PYTHON
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-lint-reports
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-test-reports
          path: ${{ steps.project.outputs.directory }}/app/build/reports/tests/
          if-no-files-found: ignore

  interface:
    if: github.event_name == 'pull_request'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise interface and capture real Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --project-dir android :app:assembleDebug :app:assembleDevice --no-daemon
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as com.irfan.rabta mkdir -p files
            adb shell run-as com.irfan.rabta touch files/rabta-ci-preservation-check
            adb install -r android/app/build/outputs/apk/device/app-device.apk
            adb shell pm path com.irfan.rabta
            adb shell pm path com.irfan.rabta.testing
            adb shell am start -W -n com.irfan.rabta.testing/com.irfan.rabta.AuthActivity
            adb shell pidof com.irfan.rabta.testing
            adb shell am force-stop com.irfan.rabta.testing
            adb shell run-as com.irfan.rabta ls files/rabta-ci-preservation-check
            bash -c 'if adb shell run-as com.irfan.rabta.testing ls files/rabta-ci-preservation-check >/dev/null 2>&1; then echo "Test package unexpectedly sees original private fixture"; exit 1; fi'
            adb shell run-as com.irfan.rabta rm files/rabta-ci-preservation-check
            bash -c 'result=0; gradle --project-dir android :app:connectedDebugAndroidTest --no-daemon || result=$?; adb pull /sdcard/Download/rabta-interface interface-screenshots || true; exit "$result"'
      - name: Summarize instrumented test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases=[]
          for path in Path('android/app/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              cases.extend(ET.parse(path).getroot().iter('testcase'))
          print('Device test totals:',{'tests':len(cases),'failed':sum(c.find('failure') is not None or c.find('error') is not None for c in cases),'skipped':sum(c.find('skipped') is not None for c in cases)})
          for case in cases:
              for tag in ('failure','error'):
                  failure=case.find(tag)
                  if failure is not None:
                      print(case.get('classname'),case.get('name'),(failure.text or '')[:6000])
          PYTHON
      - name: Review rendered premium screens
        if: always()
        shell: bash
        run: |
          if [ "${{ matrix.api }}" = 34 ] && [ -f interface-screenshots/premium-review.b64 ]; then
            echo 'RABTA_PREVIEW_BEGIN'
            cat interface-screenshots/premium-review.b64
            echo
            echo 'RABTA_PREVIEW_END'
          fi
          # The chat with stickers and the sticker panel open, on every Android version.
          if [ -f interface-screenshots/sticker-review.b64 ]; then
            echo 'RABTA_STICKER_PREVIEW_BEGIN'
            cat interface-screenshots/sticker-review.b64
            echo
            echo 'RABTA_STICKER_PREVIEW_END'
          fi
      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-interface-screenshots-api-${{ matrix.api }}
          path: interface-screenshots/
          if-no-files-found: ignore
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-device-tests-api-${{ matrix.api }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

  # Google Play signs installs with Rabta's own key, so phones that installed it from GitHub update from Play. Play
  # takes that key only encrypted for Google: once android/play/encryption_public_key.pem (Play Console, App signing,
  # "Export and upload a key from Java keystore") is in the repository, run this workflow by hand and upload the
  # Rabta-play-signing-key zip there. Until then it tries the tool on a throwaway key and uploads nothing.
  play-key:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Encrypt the release key for Google Play
        env:
          KEYSTORE_B64: ${{ secrets.RABTA_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RABTA_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RABTA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RABTA_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/pepk.jar" https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk.jar
          pem=android/play/encryption_public_key.pem
          if [ -f "$pem" ]; then
            if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then echo "The release signing secrets are missing."; exit 1; fi
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            store="$RUNNER_TEMP/release.jks"; alias="${KEY_ALIAS:-rabta}"; spass="$KEYSTORE_PASSWORD"; kpass="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"; out=rabta-play-key.zip
          else
            echo "No $pem yet: trying the tool on a throwaway key."
            keytool -genkeypair -keystore "$RUNNER_TEMP/try.jks" -alias try -keyalg RSA -keysize 2048 -validity 1 -storepass trytry -keypass trytry -dname CN=try
            openssl genrsa -out "$RUNNER_TEMP/try.pem" 2048 && openssl rsa -in "$RUNNER_TEMP/try.pem" -pubout -out "$RUNNER_TEMP/try-public.pem"
            pem="$RUNNER_TEMP/try-public.pem"; store="$RUNNER_TEMP/try.jks"; alias=try; spass=trytry; kpass=trytry; out="$RUNNER_TEMP/try.zip"
          fi
          # The tool asks for both passwords on a terminal; script gives it one.
          printf '%s\n%s\n' "$spass" "$kpass" | script -qec "java -jar '$RUNNER_TEMP/pepk.jar' --keystore='$store' --alias='$alias' --output='$out' --include-cert --rsa-aes-encryption --encryption-key-path='$pem'" /dev/null
          test -s "$out"
          echo "Encrypted for Google Play: $(stat -c %s "$out") bytes"
      - name: Upload the encrypted key
        if: hashFiles('android/play/encryption_public_key.pem') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Rabta-play-signing-key
          path: rabta-play-key.zip
          if-no-files-found: error

  # Each push to main publishes the verified public APK; installed apps find it through rabta-update.json.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rabta-release-apk
          path: rabta-release
      - name: Publish the update
        env:
          RELEASES_TOKEN: ${{ secrets.RABTA_RELEASES_TOKEN }}
          SELF_TOKEN: ${{ github.token }}
          SELF_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          name=$(python3 -c 'import json; print(json.load(open("rabta-release/rabta-update.json"))["versionName"])')
          if [ -z "$RELEASES_TOKEN" ]; then echo "RABTA_RELEASES_TOKEN is missing, so nothing can be published to $RELEASES_REPO."; exit 1; fi
          # Everyone downloads from the public releases repository; this source repository can stay private.
          GH_TOKEN="$RELEASES_TOKEN" gh release create "v$name" "rabta-release/Rabta-$name.apk" "rabta-release/Rabta-$name.aab" rabta-release/rabta-update.json \
            --repo "$RELEASES_REPO" --title "Rabta $name" --notes-file rabta-release/notes.txt --latest
          # Apps installed before the move still look in this repository; feed them while it is public.
          if [ "$SELF_PRIVATE" != "true" ]; then
            mkdir -p legacy && cp "rabta-release/Rabta-$name.apk" legacy/ && cp rabta-release/rabta-update-legacy.json legacy/rabta-update.json
            GH_TOKEN="$SELF_TOKEN" gh release create "v$name" "legacy/Rabta-$name.apk" legacy/rabta-update.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Rabta $name" --notes-file rabta-release/notes.txt --latest
          fi
